name: tmct_flt
description: Rehabilitation and stretching timer for Android and iOS.
publish_to: "none"

version: 1.2.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: ^1.6.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  vibration: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/tmct_flt.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/pilorin.wav

  fonts:
    - family: MPlusRounded
      fonts:
        - asset: fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
