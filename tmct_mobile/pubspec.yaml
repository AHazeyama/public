name: tmct_mobile
description: Rehabilitation and stretching timer for Android and iOS.
publish_to: "none"

version: 0.9.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/tmct.png"

flutter:
  uses-material-design: true
